name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      should_deploy: ${{ steps.compare_metrics.outputs.should_deploy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          python - <<'EOF'
          import json
          import os

          creds = json.loads(os.environ["CLOUD_CREDENTIALS"])
          key_id = creds.get("aws_access_key_id") or creds.get("AWS_ACCESS_KEY_ID")
          secret = creds.get("aws_secret_access_key") or creds.get("AWS_SECRET_ACCESS_KEY")
          token = creds.get("aws_session_token") or creds.get("AWS_SESSION_TOKEN")
          region = creds.get("aws_default_region") or creds.get("region") or "us-east-1"

          if not key_id or not secret:
              raise SystemExit("CLOUD_CREDENTIALS must include aws_access_key_id and aws_secret_access_key")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              env.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
              env.write(f"AWS_DEFAULT_REGION={region}\n")
              if token:
                  env.write(f"AWS_SESSION_TOKEN={token}\n")
          EOF
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: wine-quality-ci
          MLFLOW_RUN_NAME: ${{ github.event.head_commit.message || format('manual-{0}', github.run_number) }}

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"

      - name: Compare with deployed model
        id: compare_metrics
        run: |
          python - <<'EOF'
          import json
          import os

          import boto3
          from botocore.exceptions import ClientError

          bucket = os.environ["CLOUD_BUCKET"]
          current = json.load(open("outputs/metrics.json", encoding="utf-8"))
          new_accuracy = float(current["accuracy"])
          previous_accuracy = None

          try:
              boto3.client("s3").download_file(
                  bucket, "models/latest/metrics.json", "/tmp/previous-metrics.json"
              )
              previous = json.load(open("/tmp/previous-metrics.json", encoding="utf-8"))
              previous_accuracy = float(previous["accuracy"])
          except ClientError as error:
              if error.response.get("Error", {}).get("Code") not in {"404", "NoSuchKey"}:
                  raise

          should_deploy = previous_accuracy is None or new_accuracy >= previous_accuracy
          if previous_accuracy is None:
              print(f"No deployed metrics found. Candidate accuracy={new_accuracy:.4f}.")
          else:
              print(
                  f"Model comparison: candidate={new_accuracy:.4f}, "
                  f"deployed={previous_accuracy:.4f}."
              )
          print("Promotion approved." if should_deploy else "Promotion rejected: keeping deployed model.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_deploy={str(should_deploy).lower()}\n")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Upload model to Cloud Storage
        if: steps.compare_metrics.outputs.should_deploy == 'true'
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["CLOUD_BUCKET"]
          client = boto3.client("s3")
          uploads = {
              "models/model.pkl": "models/latest/model.pkl",
              "outputs/metrics.json": "models/latest/metrics.json",
              "outputs/report.txt": "models/latest/report.txt",
          }
          for source, key in uploads.items():
              client.upload_file(source, bucket, key)
              print(f"Uploaded {source} to s3://{bucket}/{key}")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          should_deploy = "${{ needs.train.outputs.should_deploy }}" == "true"
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          if not should_deploy:
              raise SystemExit("FAILED: candidate is worse than the deployed model. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.70. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for i in {1..12}; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            sudo systemctl --no-pager --full status mlops-serve || true
            sudo journalctl -u mlops-serve -n 80 --no-pager || true
            exit 1
